[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oa-pith"
version = "0.1.0"
description = "Observability-adaptive probabilistic pith localization from partial 2-D wood cross-sections"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "wood1 research project"}]
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "Pillow>=10",
  "scipy>=1.11",
  "PyYAML>=6",
]

[project.optional-dependencies]
equivariant = ["escnn>=1.0.11"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
oapith-train = "oapith.cli.train:main"
oapith-infer = "oapith.cli.infer:main"
oapith-calibrate = "oapith.cli.calibrate:main"
oapith-consensus = "oapith.cli.consensus:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = ["slow: optimization-heavy integration test"]
