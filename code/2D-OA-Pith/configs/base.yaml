data:
  manifest: data/manifest.jsonl
  root: .
  train_split: train
  validation_split: validation
  image_size: 768
  batch_size: 2
  workers: 4
  mean: [0.5, 0.5, 0.5]
  std: [0.25, 0.25, 0.25]
  raster_truncation: 0.04
  native_tile_probability: 0.5
  native_scale_jitter: [0.8, 1.25]
  augmentation:
    max_rotation_radians: 3.141592653589793
    min_scale: 0.35
    max_scale: 3.0
    max_translation: 0.45

model:
  base_channels: 32
  embedding_dim: 8
  defect_classes: 4
  mixture_components: 4
  near_extent: 2.5
  detach_variance_features: true

training:
  epochs: 150
  learning_rate: 0.0003
  weight_decay: 0.0001
  pith_weight: 1.0
  equivariance_weight: 0.15
  gradient_clip: 5.0
  amp: true
  switch_radius: 2.0
  seed: 2026
  checkpoint_every: 5

geometry:
  sample_spacing: 0.015
  minimum_sigma: 0.002
  student_df: 4.0
  outlier_scale: 8.0
  tangent_scale: 0.15
  switch_radius: 2.0
  near_max_radius: 4.0
  far_allow_affine: false
  maximum_harmonic: 5
  nesting_margin: 0.002
  warmup_steps: 35
  stage_steps: 50
  em_rounds: 3
  max_modes: 6
  mode_loss_window: 12.0
  deduplication_distance: 0.08
  deduplication_angle: 0.02
  deduplication_inverse_distance: 0.02
  stationarity_tolerance: 0.0001
  disturbance_source_options: [0, 1]

inference:
  tile_size: 768
  overlap: 192
  tile_batch_size: 2
  ring_threshold: 0.35
  minimum_arc_pixels: 12
  exact_arc_contribution: false

output_directory: runs/oa_pith
