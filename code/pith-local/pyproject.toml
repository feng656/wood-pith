[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racpith"
version = "0.1.0"
description = "RAC-Pith v2: robust pith localization and exact arc contribution analysis"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python>=4.8",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
