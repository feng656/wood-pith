[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oc-arcpith-rg"
version = "6.0.0"
description = "Bias-aware local annual-ring pith inversion Sentinel"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["oc_arcpith_rg*"]
